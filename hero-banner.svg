<svg width="100%" height="200" viewBox="0 0 1000 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4">
        <animate attributeName="stop-color" values="#06B6D4;#2563EB;#6D28D9;#06B6D4" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#2563EB">
        <animate attributeName="stop-color" values="#2563EB;#6D28D9;#06B6D4;#2563EB" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#6D28D9">
        <animate attributeName="stop-color" values="#6D28D9;#06B6D4;#2563EB;#6D28D9" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
  </defs>

  <rect width="1000" height="200" fill="url(#bgGrad)"/>

  <!-- drifting label-routing nodes, a nod to EIBP -->
  <g opacity="0.5">
    <circle cx="80" cy="40" r="3" fill="#2563EB">
      <animate attributeName="cy" values="40;160;40" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="920" cy="150" r="3" fill="#6D28D9">
      <animate attributeName="cy" values="150;30;150" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="500" cy="20" r="2.5" fill="#06B6D4">
      <animate attributeName="cy" values="20;180;20" dur="14s" repeatCount="indefinite"/>
    </circle>
    <line x1="80" y1="40" x2="500" y2="20" stroke="#2563EB" stroke-width="0.6">
      <animate attributeName="opacity" values="0.1;0.5;0.1" dur="5s" repeatCount="indefinite"/>
    </line>
    <line x1="500" y1="20" x2="920" y2="150" stroke="#6D28D9" stroke-width="0.6">
      <animate attributeName="opacity" values="0.5;0.1;0.5" dur="7s" repeatCount="indefinite"/>
    </line>
  </g>

  <text x="50%" y="92" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="44" font-weight="700" fill="url(#textGrad)">
    Sushrith Kandagatla
  </text>
  <text x="50%" y="130" text-anchor="middle" font-family="Fira Code, monospace" font-size="16" fill="#8B949E">
    root@rvu:~$ whoami
  </text>
  <text x="50%" y="158" text-anchor="middle" font-family="Fira Code, monospace" font-size="15" fill="#c9d1d9">
    agentic AI engineer · network researcher · full-stack builder
  </text>
</svg>
