<svg width="100%" height="200" viewBox="0 0 1000 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGrad" cx="30%" cy="30%" r="90%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="35%" stop-color="#1E1044"/>
      <stop offset="70%" stop-color="#0F1030"/>
      <stop offset="100%" stop-color="#050614"/>
    </radialGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6D28D9" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#6D28D9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE">
        <animate attributeName="stop-color" values="#22D3EE;#818CF8;#C084FC;#22D3EE" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#818CF8">
        <animate attributeName="stop-color" values="#818CF8;#C084FC;#22D3EE;#818CF8" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#C084FC">
        <animate attributeName="stop-color" values="#C084FC;#22D3EE;#818CF8;#C084FC" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
  </defs>

  <rect width="1000" height="200" fill="url(#bgGrad)"/>

  <!-- nebula glows, slowly pulsing -->
  <circle cx="150" cy="60" r="220" fill="url(#glow1)">
    <animate attributeName="opacity" values="0.5;0.9;0.5" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="850" cy="150" r="220" fill="url(#glow2)">
    <animate attributeName="opacity" values="0.9;0.5;0.9" dur="8s" repeatCount="indefinite"/>
  </circle>

  <!-- twinkling starfield -->
  <g fill="#ffffff">
    <circle cx="60" cy="25" r="1.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="180" cy="170" r="1"><animate attributeName="opacity" values="1;0.2;1" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="35" r="1.4"><animate attributeName="opacity" values="0.3;1;0.3" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="25" r="1"><animate attributeName="opacity" values="1;0.3;1" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="780" cy="175" r="1.3"><animate attributeName="opacity" values="0.2;1;0.2" dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="940" cy="60" r="1"><animate attributeName="opacity" values="1;0.2;1" dur="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="30" cy="120" r="1"><animate attributeName="opacity" values="0.3;1;0.3" dur="4.2s" repeatCount="indefinite"/></circle>
    <circle cx="620" cy="180" r="1.2"><animate attributeName="opacity" values="1;0.3;1" dur="5.2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- drifting label-routing nodes, a nod to EIBP -->
  <g opacity="0.7">
    <circle cx="80" cy="40" r="3" fill="#22D3EE">
      <animate attributeName="cy" values="40;160;40" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="920" cy="150" r="3" fill="#C084FC">
      <animate attributeName="cy" values="150;30;150" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="500" cy="20" r="2.5" fill="#818CF8">
      <animate attributeName="cy" values="20;180;20" dur="14s" repeatCount="indefinite"/>
    </circle>
    <line x1="80" y1="40" x2="500" y2="20" stroke="#818CF8" stroke-width="0.8">
      <animate attributeName="opacity" values="0.15;0.6;0.15" dur="5s" repeatCount="indefinite"/>
    </line>
    <line x1="500" y1="20" x2="920" y2="150" stroke="#C084FC" stroke-width="0.8">
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="7s" repeatCount="indefinite"/>
    </line>
  </g>

  <text x="50%" y="92" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="44" font-weight="700" fill="url(#textGrad)">
    Sushrith Kandagatla
  </text>
  <text x="50%" y="130" text-anchor="middle" font-family="Fira Code, monospace" font-size="16" fill="#A78BFA">
    root@rvu:~$ whoami
  </text>
  <text x="50%" y="158" text-anchor="middle" font-family="Fira Code, monospace" font-size="15" fill="#E0E7FF">
    agentic AI engineer · network researcher · full-stack builder
  </text>
</svg>
